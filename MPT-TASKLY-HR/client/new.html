<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Taskly HR - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Wix Madefor Text"', 'sans-serif'] },
          colors: {
            'taskly-red': '#aa0000',
            'taskly-purple': '#4a007e',
            'taskly-dark': '#000043',
          }
        }
      }
    }
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-[#F8F9FD] min-h-screen font-sans flex overflow-hidden text-gray-700">

  <!-- MAIN CONTENT (KIRI) -->
  <main class="flex-1 h-screen overflow-y-auto p-4 md:p-8 scrollbar-hide bg-gray-50/50">
    
    <!-- HEADER (PLAIN - TANPA MENU NAVIGASI) -->
    <header class="bg-white rounded-[50px] shadow-sm border border-gray-100 px-8 py-3 flex justify-between items-center mb-8 relative z-20">
      <div class="text-2xl font-bold bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark bg-clip-text text-transparent tracking-tight whitespace-nowrap cursor-default">
        TASKLY HR
      </div>
      
    </header>

    <!-- GRID DASHBOARD (KOSONG / MATI) -->
    <div class="max-w-[1400px] mx-auto space-y-6 pb-10 opacity-60 pointer-events-none filter grayscale-[20%]">

      <!-- KANBAN EMPTY -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
        <div class="bg-white rounded-[24px] p-5 shadow-sm border border-gray-100 min-h-[300px] flex flex-col gap-3">
          <div class="flex justify-between items-center border-b border-gray-50 pb-2">
            <h3 class="text-lg font-bold text-taskly-dark">To Do</h3>
            <span class="bg-gray-100 text-gray-500 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
          </div>
          <div class="w-full h-14 border-2 border-dashed border-gray-200 rounded-[18px] bg-gray-50/50 flex items-center justify-center text-gray-400 text-sm">No assignment yet</div>
        </div>
        <div class="bg-white rounded-[24px] p-5 shadow-sm border border-gray-100 min-h-[300px] flex flex-col gap-3">
          <div class="flex justify-between items-center border-b border-gray-50 pb-2">
            <h3 class="text-lg font-bold text-taskly-purple">In Progress</h3>
            <span class="bg-purple-50 text-taskly-purple text-xs font-bold px-2 py-0.5 rounded-full">0</span>
          </div>
          <div class="w-full h-14 border-2 border-dashed border-gray-200 rounded-[18px] bg-gray-50/50 flex items-center justify-center text-gray-400 text-sm">No assignment yet</div>
        </div>
        <div class="bg-white rounded-[24px] p-5 shadow-sm border border-gray-100 min-h-[300px] flex flex-col gap-3">
          <div class="flex justify-between items-center border-b border-gray-50 pb-2">
            <h3 class="text-lg font-bold text-orange-600">Review</h3>
            <span class="bg-orange-50 text-orange-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
          </div>
          <div class="w-full h-14 border-2 border-dashed border-gray-200 rounded-[18px] bg-gray-50/50 flex items-center justify-center text-gray-400 text-sm">No assignment yet</div>
        </div>
        <div class="bg-white rounded-[24px] p-5 shadow-sm border border-gray-100 min-h-[300px] flex flex-col gap-3">
          <div class="flex justify-between items-center border-b border-gray-50 pb-2">
            <h3 class="text-lg font-bold text-green-600">Done</h3>
            <span class="bg-green-50 text-green-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
          </div>
          <div class="w-full h-14 border-2 border-dashed border-gray-200 rounded-[18px] bg-gray-50/50 flex items-center justify-center text-gray-400 text-sm">No assignment yet</div>
        </div>
      </div>

      <!-- WIDGETS EMPTY -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 flex flex-col gap-6">
          <div class="bg-white rounded-[24px] p-6 shadow-sm border border-gray-100 flex flex-col md:flex-row items-center justify-between gap-4">
            <h3 class="text-xl font-bold text-taskly-red">Recommended task</h3>
            <div class="w-full md:w-2/3 h-12 bg-gray-50 border border-gray-200 rounded-[16px] bg-gray-50/50 flex items-center justify-center text-gray-400 text-sm">No recommendation yet</div>
          </div>
          <div class="bg-white rounded-[24px] p-8 shadow-sm border border-gray-100 flex-1 flex flex-col justify-center">
            <div class="flex justify-between items-end mb-4">
              <h3 class="text-2xl font-bold text-taskly-dark">Weekly Progress</h3>
              <span class="text-xs font-bold bg-gray-100 text-gray-500 px-3 py-1 rounded-full">-</span>
            </div>
            <div class="w-full h-12 rounded-full border border-gray-200 bg-gray-50 p-1 relative flex items-center">
              <div class="bg-gray-400 text-white h-full w-14 rounded-full flex items-center justify-center font-bold text-xs z-10">0%</div>
              <div class="flex-1 h-full rounded-r-full"></div>
            </div>
            <p class="text-center text-gray-400 mt-4 text-sm font-medium">No data available</p>
          </div>
        </div>
        <div class="lg:col-span-5 bg-white rounded-[24px] p-8 shadow-sm border border-gray-100 flex flex-col h-full">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-bold text-taskly-dark">Reminder</h3>
          </div>
          <div class="flex-1 flex items-center justify-center text-gray-400 font-medium">No reminders yet</div>
        </div>
      </div>
    </div>
  </main>

  <!-- SIDEBAR KANAN (KOSONG - CUMA TOMBOL +) -->
  <aside class="w-[90px] bg-white flex flex-col items-center py-6 gap-6 border-l border-gray-100 relative z-30 shadow-[-4px_0_20px_rgba(0,0,0,0.02)]">
    
    <!-- Profil -->
    <div class="relative group cursor-pointer mt-2">
      <div class="w-14 h-14 rounded-full border-[3px] border-white shadow-md overflow-hidden">
        <img id="userAvatar" src="https://ui-avatars.com/api/?name=New+User&background=f1f5f9&color=64748b&size=128" alt="Profile" class="w-full h-full object-cover grayscale">
      </div>
      <div class="absolute bottom-1 right-1 w-3.5 h-3.5 bg-gray-300 border-2 border-white rounded-full"></div>
    </div>

    <!-- Divider -->
    <div class="w-8 h-[2px] bg-gray-100 rounded-full"></div>

    <!-- Tombol Add -->
    <div class="flex flex-col gap-4 w-full items-center flex-1 px-2 relative">
      <a href="create.html" class="w-10 h-10 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:text-taskly-purple hover:border-taskly-purple hover:bg-white transition-all mt-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </a>
    </div>
  </aside>

  <script>
    // Script ambil nama user buat avatar
    const username = localStorage.getItem('username');
    if(username) {
      document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${username}&background=f1f5f9&color=64748b&size=128`;
    }
  </script>

</body>
</html>
