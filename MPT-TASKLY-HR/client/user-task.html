<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly HR - My Task</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Wix Madefor Text"', 'sans-serif'] },
          colors: {
            'taskly-red': '#8B0000',
            'taskly-purple': '#3B0060',
            'taskly-dark': '#000043',
          }
        }
      }
    }
  </script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Animasi Hover Navbar (Konsisten dengan Dashboard) */
    .nav-link { position: relative; color: #9ca3af; font-weight: 500; transition: color 0.3s ease; }
    .nav-link:hover { color: #3B0060; }
    .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #3B0060; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
  </style>
</head>

<body class="bg-[#F8F9FD] min-h-screen font-sans flex overflow-hidden text-gray-700">

  <!-- ================= KONTEN UTAMA (KIRI) ================= -->
  <main class="flex-1 h-screen overflow-y-auto p-4 md:p-8 scrollbar-hide">
    
    <!-- HEADER NAVBAR (Konsisten dengan Dashboard) -->
    <header class="bg-white rounded-[50px] shadow-sm border border-gray-100 px-8 py-3 flex justify-between items-center mb-6 relative z-20">
      <div class="text-2xl font-bold bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark bg-clip-text text-transparent tracking-tight whitespace-nowrap cursor-default">
        TASKLY HR
      </div>
      <div class="flex items-center gap-8">
        <a href="user-dashboard.html" class="nav-link">
          Dashboard
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="#" class="bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark text-white px-6 py-2.5 rounded-full font-bold shadow-md tracking-wide text-sm hover:scale-105 transition-transform">Task</a>
          <a href="user-performance.html" class="nav-link">Performance</a>
          <a href="#" class="nav-link">Notification</a>
        </nav>
      </div>
    </header>

    <!-- TASK TABLE CARD -->
    <div class="max-w-[1400px] mx-auto">
      <div class="bg-white rounded-[30px] p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[600px]">
        
        <!-- Judul & Filter -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
          <h2 class="text-3xl font-bold text-[#8B0000]">My Task</h2>
          
          <div class="flex items-center gap-3">
            <!-- 1. DROPDOWN PROJECT (Pengganti Tanggal) -->
            <div class="relative group">
              <select id="projectSelect" onchange="handleProjectChange()" class="appearance-none bg-gray-50 border border-gray-200 text-gray-600 py-2.5 pl-5 pr-10 rounded-xl font-medium focus:outline-none focus:border-taskly-purple cursor-pointer hover:bg-gray-100 transition-colors min-w-[200px] text-sm">
                <option value="" disabled selected>Choose Project...</option>
                <!-- Opsi Project akan diisi JS -->
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- TABLE HEADER -->
        <div class="grid grid-cols-12 gap-4 text-gray-500 font-bold text-lg mb-4 px-2">
          <div class="col-span-4">Task Name</div>
          <div class="col-span-2 text-center border-l border-gray-200">Status</div>
          <div class="col-span-1 text-center border-l border-gray-200">Effort</div>
          <div class="col-span-1 text-center border-l border-gray-200">Value</div>
          <div class="col-span-2 text-center border-l border-gray-200">Due Date</div>
          <div class="col-span-2 text-center"></div> <!-- Kolom Kosong untuk Tombol Update -->
        </div>

        <!-- LIST TUGAS (Container) -->
        <div id="taskListContainer" class="space-y-4">
          <!-- Loading State -->
          <div class="text-center py-10 text-gray-400 animate-pulse">Loading tasks...</div>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= SIDEBAR KANAN ================= -->
  <aside class="w-[90px] bg-[#F8F9FD] flex flex-col items-center py-6 gap-6 border-l border-gray-200/50 relative z-30 shadow-[-4px_0_20px_rgba(0,0,0,0.02)]">
    
    <!-- PROFIL USER -->
    <div class="relative group cursor-pointer mt-2">
      <div class="w-14 h-14 rounded-full border-[3px] border-white shadow-lg overflow-hidden transition-transform transform group-hover:scale-105">
        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=000043&color=fff" class="w-full h-full object-cover">
      </div>
    </div>
    
    <div class="w-8 h-[2px] bg-gray-200 rounded-full"></div>
    
    <!-- LIST WORKSPACE (Isinya Icon Workspace Aktif) -->
    <div id="workspaceIconList" class="flex flex-col gap-4 w-full items-center">
      <!-- Ikon workspace akan muncul disini via JS -->
    </div>

    <!-- TOMBOL ADD WORKSPACE (+) -->
    <a href="create.html" class="w-10 h-10 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:text-taskly-purple hover:border-taskly-purple hover:bg-white transition-all mt-2" title="Create or Join Workspace">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </a>

  </aside>

  <!-- ================= MODAL UPDATE STATUS ================= -->
  <div id="updateModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity">
    <div class="bg-white p-8 rounded-[30px] w-full max-w-sm shadow-2xl transform scale-95 transition-transform" id="updateModalContent">
      <h3 class="text-xl font-bold mb-4 text-taskly-dark text-center">Update Status</h3>
      <p id="modalTaskTitle" class="text-center text-gray-500 mb-6 text-sm truncate">Task Title</p>
      
      <div class="space-y-3">
        <button onclick="setStatus('To Do')" class="w-full py-3 rounded-xl border border-gray-200 hover:bg-gray-50 hover:border-gray-400 font-medium transition">To Do</button>
        <button onclick="setStatus('In Progress')" class="w-full py-3 rounded-xl border border-purple-200 text-purple-700 bg-purple-50 hover:bg-purple-100 font-medium transition">In Progress</button>
        <button onclick="setStatus('Review')" class="w-full py-3 rounded-xl border border-orange-200 text-orange-700 bg-orange-50 hover:bg-orange-100 font-medium transition">Review</button>
        <button onclick="setStatus('Done')" class="w-full py-3 rounded-xl border border-green-200 text-green-700 bg-green-50 hover:bg-green-100 font-medium transition">Done</button>
      </div>

      <button onclick="closeUpdateModal()" class="mt-6 w-full py-2 text-gray-400 text-sm hover:text-gray-600">Cancel</button>
    </div>
  </div>

  <!-- ================= SCRIPT LOGIC ================= -->
  <script>
    let currentWorkspaceId = null;
    let selectedTaskId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const userId = localStorage.getItem('userId');
      const username = localStorage.getItem('username');
      
      if (!userId) {
        window.location.href = 'login.html';
        return;
      }

      // Set Inisial Avatar
      if(username) {
        document.getElementById('userInitial').innerText = username.charAt(0).toUpperCase();
      }

      try {
        const res = await fetch(`http://localhost:3000/api/auth/${userId}`);
        const data = await res.json();
        
        if(res.ok && data.data.workspace) {
          currentWorkspaceId = data.data.workspace.id;
          loadTasks();
        } else {
          // Kalau tidak punya workspace, arahkan user
          alert("Anda belum memiliki Workspace.");
          window.location.href = 'new.html';
        }
      } catch (err) { console.error(err); }
    });

    async function loadTasks() {
      if(!currentWorkspaceId) return;
      
      try {
        const res = await fetch(`http://localhost:3000/api/task/${currentWorkspaceId}`);
        const json = await res.json();
        const tasks = json.data;
        const container = document.getElementById('taskListContainer');

        container.innerHTML = ''; // Clear loading

        if(tasks.length === 0) {
          container.innerHTML = `<div class="text-center py-10 text-gray-400">No tasks found</div>`;
          return;
        }

        tasks.forEach(task => {
          // Format Tanggal (Due Date)
          let dateStr = "-";
          if(task.dueDate) {
            const d = new Date(task.dueDate);
            dateStr = d.toLocaleDateString('en-GB'); // DD/MM/YYYY
          }

          // HTML Row per Task (Sesuai Desain Gambar)
          const row = `
            <div class="grid grid-cols-12 gap-4 items-center group animate-in fade-in slide-in-from-bottom-2 duration-500">
              
              <!-- Task Name (Pill) -->
              <div class="col-span-4">
                <div class="border border-gray-400 rounded-full px-5 py-3 text-gray-600 font-medium truncate bg-white">
                  ${task.title}
                </div>
              </div>

              <!-- Status (Pill) -->
              <div class="col-span-2 flex justify-center">
                <div class="border border-gray-400 rounded-full px-6 py-3 text-gray-600 font-medium w-full text-center bg-white truncate">
                  ${task.status}
                </div>
              </div>

              <!-- Effort (Pill) -->
              <div class="col-span-1 flex justify-center">
                <div class="border border-gray-400 rounded-full px-2 py-3 text-gray-600 font-medium w-full text-center bg-white">
                  - <!-- Data belum ada di DB -->
                </div>
              </div>

              <!-- Value (Pill) -->
              <div class="col-span-1 flex justify-center">
                <div class="border border-gray-400 rounded-full px-2 py-3 text-gray-600 font-medium w-full text-center bg-white">
                  - <!-- Data belum ada di DB -->
                </div>
              </div>

              <!-- Due Date (Pill) -->
              <div class="col-span-2 flex justify-center">
                <div class="border border-gray-400 rounded-full px-4 py-3 text-gray-600 font-medium w-full text-center bg-white text-sm">
                  ${dateStr}
                </div>
              </div>

              <!-- Update Button -->
              <div class="col-span-2 flex justify-end">
                <button onclick="openUpdateModal(${task.id}, '${task.title}')" class="w-full bg-gradient-to-r from-[#aa0000] via-[#4a007e] to-[#000043] text-white font-bold py-3 rounded-full shadow-md hover:scale-105 transition-transform">
                  Update
                </button>
              </div>

            </div>
          `;
          container.insertAdjacentHTML('beforeend', row);
        });

      } catch (e) {
        console.error("Error loading tasks:", e);
      }
    }

    // --- LOGIKA UPDATE STATUS ---
    function openUpdateModal(taskId, title) {
      selectedTaskId = taskId;
      document.getElementById('modalTaskTitle').innerText = title;
      
      const modal = document.getElementById('updateModal');
      const content = document.getElementById('updateModalContent');
      
      modal.classList.remove('hidden');
      setTimeout(() => { 
        content.classList.remove('scale-95'); 
      }, 10);
    }

    function closeUpdateModal() {
      const modal = document.getElementById('updateModal');
      const content = document.getElementById('updateModalContent');
      
      content.classList.add('scale-95');
      setTimeout(() => { 
        modal.classList.add('hidden'); 
        selectedTaskId = null;
      }, 150);
    }

    async function setStatus(newStatus) {
      if(!selectedTaskId) return;

      try {
        await fetch(`http://localhost:3000/api/task/${selectedTaskId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        
        closeUpdateModal();
        loadTasks(); // Refresh tabel
      } catch(e) {
        alert("Gagal update status");
      }
    }

    // Untuk tombol (+) di sidebar, kita bisa arahkan kembali ke Dashboard untuk buka modal create
    // Atau buat modal create task di sini juga. Untuk simplifikasi, saya arahkan ke dashboard.
    function openTaskModal() {
       window.location.href = 'user-dashboard.html';
    }

  </script>

</body>
</html>
