<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Taskly HR - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Wix Madefor Text"', 'sans-serif'] } } } }
  </script>
</head>

<body class="bg-white min-h-[100dvh] w-full flex flex-col justify-between relative overflow-x-hidden font-sans">

  <main class="flex-1 flex justify-center items-center w-full px-4 py-6">
    <div class="bg-white/90 backdrop-blur-sm md:backdrop-blur-none md:bg-white w-full max-w-[500px] p-6 md:p-10 rounded-[30px] shadow-[0_8px_30px_rgba(0,0,0,0.12)] md:shadow-[0_10px_40px_rgba(0,0,0,0.08)] border border-gray-100/50 md:border-gray-100 text-center relative z-10">
      
      <h1 class="text-3xl md:text-[48px] font-bold mb-6 md:mb-8 bg-gradient-to-r from-[#aa0000] via-[#4a007e] to-[#000043] bg-clip-text text-transparent tracking-tight">
        TASKLY HR
      </h1>

      <form id="registerForm" class="w-full space-y-4 md:space-y-5">
        <div class="text-left group">
          <label for="username" class="block text-base md:text-lg text-[#656565] mb-1 ml-3 font-medium">Username</label>
          <input type="text" id="username" required
            class="w-full py-3 md:py-3.5 px-5 text-base md:text-lg rounded-full border-none bg-[#f9f9f9] text-gray-700 shadow-[inset_3px_3px_6px_rgba(0,0,0,0.08),inset_-3px_-3px_6px_rgba(255,255,255,0.9)] focus:outline-none focus:ring-2 focus:ring-[#4a007e]/20 transition-all">
        </div>

        <div class="text-left group">
          <label for="email" class="block text-base md:text-lg text-[#656565] mb-1 ml-3 font-medium">Email</label>
          <input type="email" id="email" required
            class="w-full py-3 md:py-3.5 px-5 text-base md:text-lg rounded-full border-none bg-[#f9f9f9] text-gray-700 shadow-[inset_3px_3px_6px_rgba(0,0,0,0.08),inset_-3px_-3px_6px_rgba(255,255,255,0.9)] focus:outline-none focus:ring-2 focus:ring-[#4a007e]/20 transition-all">
        </div>

        <div class="text-left group">
          <label for="password" class="block text-base md:text-lg text-[#656565] mb-1 ml-3 font-medium">Password</label>
          <input type="password" id="password" required
            class="w-full py-3 md:py-3.5 px-5 text-base md:text-lg rounded-full border-none bg-[#f9f9f9] text-gray-700 shadow-[inset_3px_3px_6px_rgba(0,0,0,0.08),inset_-3px_-3px_6px_rgba(255,255,255,0.9)] focus:outline-none focus:ring-2 focus:ring-[#4a007e]/20 transition-all">
        </div>

        <button type="submit" class="w-full py-3 md:py-3.5 mt-6 rounded-full text-xl font-bold text-white bg-gradient-to-r from-[#aa0000] via-[#4a007e] to-[#000043] shadow-[0_8px_15px_rgba(74,0,126,0.25)] hover:scale-[1.02] active:scale-95 transition-all">
          REGISTER
        </button>
      </form>

      <div class="mt-6 text-[#656565]">
        <a href="login.html" class="text-[#656565] text-lg border-b border-[#9c9c9c] hover:text-[#4a007e] hover:border-[#4a007e] transition-colors pb-0.5">
          Login Now
        </a>
      </div>
    </div>
  </main>

  <footer class="w-full bg-gradient-to-r from-[#aa0000] via-[#4a007e] to-[#000043] text-white/90 text-[11px] md:text-sm z-50 flex flex-col md:flex-row justify-center md:justify-between items-center px-6 md:px-[100px] py-4 md:h-[60px] gap-2 md:gap-0 shrink-0 tracking-wider font-light">
    <div class="order-2 md:order-1 flex items-center gap-1.5 hover:text-white transition-colors cursor-pointer group">
      <span>taskly.hr@gmail.com</span>
    </div>
    <div class="order-1 md:order-2 font-semibold uppercase tracking-[0.15em] text-xs md:text-sm hover:text-white transition-colors cursor-pointer mb-1 md:mb-0">www.tasklyhr.com</div>
    <div class="order-3 md:order-3 flex items-center gap-1.5 hover:text-white transition-colors cursor-pointer group">
      <span>@taskly.hr</span>
    </div>
  </footer>

  <!-- SCRIPT REGISTER -->
  <script>
    const registerForm = document.getElementById('registerForm');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const result = await response.json();

        if (response.ok) {
          alert('Registrasi Berhasil! Silakan Login.');
          window.location.href = 'login.html'; // Ke Login agar masuk logic authController
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        console.error(err);
        alert('Server Error. Pastikan backend nyala!');
      }
    });
  </script>

</body>
</html>
