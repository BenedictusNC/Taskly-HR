<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly HR - Kinerja</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Wix Madefor Text"', 'sans-serif'] },
          colors: {
            'taskly-red': '#8B0000',
            'taskly-purple': '#3B0060',
            'taskly-dark': '#000043',
          }
        }
      }
    }
  </script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .nav-link { position: relative; color: #9ca3af; font-weight: 500; transition: color 0.3s ease; }
    .nav-link:hover { color: #3B0060; }
    .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #3B0060; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
  </style>
</head>

<body class="bg-[#F8F9FD] min-h-screen font-sans flex overflow-hidden text-gray-700">

  <!-- ================= KONTEN UTAMA (KIRI) ================= -->
  <main class="flex-1 h-screen overflow-y-auto p-4 md:p-8 scrollbar-hide">
    
    <!-- HEADER NAVBAR -->
    <header class="bg-white rounded-[50px] shadow-sm border border-gray-100 px-8 py-3 flex justify-between items-center mb-6 relative z-20">
      <div class="text-2xl font-bold bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark bg-clip-text text-transparent tracking-tight whitespace-nowrap cursor-default">
        TASKLY HR
      </div>
      <div class="flex items-center gap-8">
        <a href="user-dashboard.html" class="nav-link">
          Dashboard
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="user-task.html" class="nav-link">Task</a>
          <a href="#" class="bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark text-white px-6 py-2.5 rounded-full font-bold shadow-md tracking-wide text-sm hover:scale-105 transition-transform">Performance</a>
          <a href="#" class="nav-link">Notification</a>
        </nav>
      </div>
    </header>

    <!-- CONTENT GRID -->
    <div class="max-w-[1400px] mx-auto space-y-6">

      <!-- BARIS 1: KPI CARDS (3 KOTAK DI ATAS) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Contribution Score -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col items-center justify-center min-h-[140px]">
          <h3 class="text-lg font-bold text-taskly-dark mb-2">Contribution Score</h3>
          <span class="text-5xl font-bold text-[#8B0000]">9.75</span>
        </div>

        <!-- Task Completion Rate -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col items-center justify-start min-h-[140px]">
          <h3 class="text-lg font-bold text-[#8B0000] mb-2">Task Completition Rate</h3>
          <!-- Placeholder Data -->
          <div class="flex-1 w-full flex items-center justify-center text-gray-300 text-sm italic">
            Chart Placeholder
          </div>
        </div>

        <!-- Avg. Completion Time -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col items-center justify-start min-h-[140px]">
          <h3 class="text-lg font-bold text-taskly-dark mb-2">Avg. Completition Time</h3>
          <div class="flex-1 w-full flex items-center justify-center text-gray-300 text-sm italic">
            Chart Placeholder
          </div>
        </div>

      </div>

      <!-- BARIS 2: GRAPH & REVISION (BAWAH) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- GRAPH (KIRI - LEBAR) - Span 8 -->
        <div class="lg:col-span-8 bg-white rounded-[24px] p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[400px]">
          <h3 class="text-xl font-bold text-[#8B0000] mb-6">Graph</h3>
          
          <!-- Area Kosong untuk Grafik -->
          <div class="w-full h-[300px] border-2 border-dashed border-gray-100 rounded-xl flex items-center justify-center bg-gray-50">
            <span class="text-gray-400 font-medium">Performance Chart Area</span>
          </div>
        </div>

        <!-- REVISION COUNT (KANAN - SEMPIT) - Span 4 -->
        <div class="lg:col-span-4 bg-white rounded-[24px] p-8 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[400px] flex flex-col">
          <h3 class="text-xl font-bold text-taskly-dark mb-6 text-center">Revision Count</h3>
          
          <!-- Area Kosong -->
          <div class="flex-1 border-2 border-dashed border-gray-100 rounded-xl flex items-center justify-center bg-gray-50">
            <span class="text-gray-400 font-medium">No Data</span>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- ================= SIDEBAR KANAN ================= -->
  <aside class="w-[90px] bg-[#F8F9FD] flex flex-col items-center py-6 gap-6 border-l border-gray-200/50 relative z-30 shadow-[-4px_0_20px_rgba(0,0,0,0.02)]">
    
    <!-- PROFIL USER -->
    <div class="relative group cursor-pointer mt-2">
      <div class="w-14 h-14 rounded-full border-[3px] border-white shadow-lg overflow-hidden transition-transform transform group-hover:scale-105">
        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=000043&color=fff" class="w-full h-full object-cover">
      </div>
    </div>
    
    <div class="w-8 h-[2px] bg-gray-200 rounded-full"></div>
    
    <!-- LIST WORKSPACE (Isinya Icon Workspace Aktif) -->
    <div id="workspaceIconList" class="flex flex-col gap-4 w-full items-center">
      <!-- Ikon workspace akan muncul disini via JS -->
    </div>

    <!-- TOMBOL ADD WORKSPACE (+) -->
    <a href="create.html" class="w-10 h-10 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:text-taskly-purple hover:border-taskly-purple hover:bg-white transition-all mt-2" title="Create or Join Workspace">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </a>

  </aside>

  <!-- SCRIPT LOGIC (OPTIONAL: UNTUK AVATAR) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const username = localStorage.getItem('username');
      if (username) {
        document.getElementById('userInitial').innerText = username.charAt(0).toUpperCase();
      }
    });
  </script>

</body>
</html>
