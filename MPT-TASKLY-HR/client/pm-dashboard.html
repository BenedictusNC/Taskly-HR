<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly HR - PM Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Wix Madefor Text"', 'sans-serif'] },
          colors: {
            'taskly-red': '#8B0000',
            'taskly-purple': '#3B0060',
            'taskly-dark': '#000043',
          }
        }
      }
    }
  </script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .nav-link { position: relative; color: #9ca3af; font-weight: 500; transition: color 0.3s ease; }
    .nav-link:hover { color: #3B0060; }
    .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #3B0060; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
  </style>
</head>

<body class="bg-[#F8F9FD] min-h-screen font-sans flex overflow-hidden text-gray-700">

  <!-- ================= KONTEN UTAMA (KIRI) ================= -->
  <main class="flex-1 h-screen overflow-y-auto p-4 md:p-8 scrollbar-hide relative">
    
    <!-- HEADER NAVBAR -->
    <header class="bg-white rounded-[50px] shadow-sm border border-gray-100 px-8 py-3 flex justify-between items-center mb-6 relative z-20">
      <div class="text-2xl font-bold bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark bg-clip-text text-transparent tracking-tight whitespace-nowrap cursor-default">
        TASKLY HR
      </div>
      <div class="flex items-center gap-8">
        <a href="#" class="bg-gradient-to-r from-taskly-red via-taskly-purple to-taskly-dark text-white px-6 py-2.5 rounded-full font-bold shadow-md tracking-wide text-sm hover:scale-105 transition-transform">
          Dashboard
        </a>
        <nav class="hidden md:flex items-center gap-8">
          <a href="pm-Task.html" class="nav-link">Task</a>
          <a href="pm-performance.html" class="nav-link">Performance</a>
          <a href="#" class="nav-link">Notification</a>
        </nav>
      </div>
    </header>

    <!-- CONTENT GRID -->
    <div class="max-w-[1400px] mx-auto space-y-6 pb-20">

      <!-- BARIS 1: KANBAN (4 KOLOM) -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- To Do -->
        <div class="bg-white p-6 rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[300px] flex flex-col">
          <h3 class="text-xl font-bold text-[#8B0000] mb-4">To Do</h3>
          <div class="w-full h-12 border border-gray-200 rounded-full bg-white mb-2"></div>
        </div>

        <!-- In Progress -->
        <div class="bg-white p-6 rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[300px] flex flex-col">
          <h3 class="text-xl font-bold text-taskly-purple mb-4">In Progress</h3>
          <div class="w-full h-12 border border-gray-200 rounded-full bg-white mb-2"></div>
        </div>

        <!-- Review -->
        <div class="bg-white p-6 rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[300px] flex flex-col">
          <h3 class="text-xl font-bold text-[#8B0000] mb-4">Review</h3>
        </div>

        <!-- Done -->
        <div class="bg-white p-6 rounded-[24px] shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 min-h-[300px] flex flex-col">
          <h3 class="text-xl font-bold text-taskly-purple mb-4">Done</h3>
          <div class="w-full h-12 border border-gray-200 rounded-full bg-white mb-2"></div>
        </div>

      </div>

      <!-- BARIS 2: WIDGETS (3 KOLOM) -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 1. Weekly Progress -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col justify-between">
          <div>
            <h3 class="text-xl font-bold text-[#8B0000] mb-4">Weekly Progress</h3>
            
            <!-- Progress Bar -->
            <div class="w-full h-12 rounded-[16px] border border-taskly-dark p-1 relative flex items-center bg-white">
              <div class="bg-[#8B0000] text-white h-full w-[30%] rounded-[12px] flex items-center justify-center font-bold text-lg shadow-sm z-10">
                30%
              </div>
              <div class="flex-1 h-full bg-white rounded-r-[12px]"></div>
            </div>
            <p class="text-center text-gray-500 mt-3 text-sm font-medium">3 from 10 task already done</p>
          </div>
          
          <p class="text-gray-400 text-sm mt-4">0 Overdue Task</p>
        </div>

        <!-- 2. Active Member -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col items-center">
          <h3 class="text-xl font-bold text-taskly-dark mb-6 w-full text-left">Active Member</h3>
          
          <div class="flex flex-col gap-3 w-full">
            <button class="w-full py-3 rounded-full bg-gradient-to-r from-[#8B0000] to-[#000043] text-white font-bold text-sm shadow-md hover:scale-105 transition-transform">
              Add new member
            </button>
            <button class="w-full py-3 rounded-full bg-gradient-to-r from-[#8B0000] to-[#000043] text-white font-bold text-sm shadow-md hover:scale-105 transition-transform">
              List
            </button>
            <button class="w-full py-3 rounded-full bg-gradient-to-r from-[#8B0000] to-[#000043] text-white font-bold text-sm shadow-md hover:scale-105 transition-transform">
              Settings
            </button>
          </div>
        </div>

        <!-- 3. Upcoming Deadline -->
        <div class="bg-white rounded-[24px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 flex flex-col">
          <h3 class="text-xl font-bold text-[#8B0000] mb-6 leading-tight">Upcoming<br>Deadline</h3>
          
          <div class="space-y-3 w-full">
            <div class="w-full h-10 border border-gray-200 rounded-full bg-white"></div>
            <div class="w-full h-10 border border-gray-200 rounded-full bg-white"></div>
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- ================= SIDEBAR KANAN ================= -->
  <aside class="w-[90px] bg-[#F8F9FD] flex flex-col items-center py-6 gap-6 border-l border-gray-200/50 relative z-30 shadow-[-4px_0_20px_rgba(0,0,0,0.02)]">
    
    <!-- PROFIL USER -->
    <div class="relative group cursor-pointer mt-2">
      <div class="w-14 h-14 rounded-full border-[3px] border-white shadow-lg overflow-hidden transition-transform transform group-hover:scale-105">
        <img id="userAvatar" src="https://ui-avatars.com/api/?name=User&background=000043&color=fff" class="w-full h-full object-cover">
      </div>
    </div>
    
    <div class="w-8 h-[2px] bg-gray-200 rounded-full"></div>
    
    <!-- LIST WORKSPACE (Isinya Icon Workspace Aktif) -->
    <div id="workspaceIconList" class="flex flex-col gap-4 w-full items-center">
      <!-- Ikon workspace akan muncul disini via JS -->
    </div>

    <!-- TOMBOL ADD WORKSPACE (+) -->
    <a href="create.html" class="w-10 h-10 rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400 hover:text-taskly-purple hover:border-taskly-purple hover:bg-white transition-all mt-2" title="Create or Join Workspace">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </a>

  </aside>

<script>
    let currentWorkspaceId = null; 

    // --- HELPER FUNCTIONS (Diperlukan untuk sidebar) ---
    // PENTING: Anda harus menyalin semua helper functions ini
    
    function getInitials(name) {
        if (!name) return 'US'; 
        return name.split(' ').map(n => n.charAt(0)).join('').toUpperCase();
    }

    function renderProfile(username) {
        const initials = getInitials(username);
        const avatarElement = document.getElementById('userAvatar');
        if (avatarElement) {
            avatarElement.outerHTML = `<div id="userAvatar" class="w-14 h-14 rounded-full border-[3px] border-white shadow-lg overflow-hidden transition-transform transform group-hover:scale-105 bg-taskly-dark flex items-center justify-center text-white text-xl font-bold">${initials}</div>`;
        }
    }
    
    function renderWorkspaceIcons(memberships) {
        const listContainer = document.getElementById('workspaceIconList');
        if (!listContainer) return;
        listContainer.innerHTML = ''; 
        memberships.forEach(member => {
            const ws = member.workspace;
            if (!ws) return;
            const initials = getInitials(ws.name);
            const isActive = (ws.id === currentWorkspaceId) ? 'border-taskly-purple' : 'border-gray-200';
            const html = `<div class="w-12 h-12 rounded-[16px] bg-white border-2 ${isActive} shadow-md flex items-center justify-center text-taskly-purple font-bold text-lg cursor-pointer transition-all hover:scale-105" title="${ws.name}">${initials}</div>`;
            listContainer.insertAdjacentHTML('beforeend', html);
        });
    }

    // --- INIT (DOMContentLoaded) ---
    document.addEventListener('DOMContentLoaded', async () => {
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const currentWorkspaceId = localStorage.getItem('currentWorkspaceId');

        if (!userId || !currentWorkspaceId) {
            window.location.replace('login.html'); // Wajib login jika sesi tidak ada
            return;
        }
        
        // Panggilan API untuk mendapatkan profil (diperlukan untuk sidebar dan validasi role)
        const res = await fetch(`http://localhost:3000/api/auth/${userId}`);
        const data = await res.json();
        
        if (res.ok && data.data.workspace) {
            // Set Sidebar
            renderProfile(username || data.data.username);
            renderWorkspaceIcons(data.data.allMemberships);
            
            // Muat data spesifik PM Dashboard di sini
            console.log("PM Dashboard loaded successfully. Content needs to be filled.");
            
        } else {
             // Jika sesi valid tapi tidak ada workspace, kirim ke onboarding
             window.location.replace('new.html');
        }
    });
</script>

</body>
</html>
