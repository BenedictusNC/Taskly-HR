  <script>
    let currentWorkspaceId = null;
    let draggedTaskId = null;
    let draggedTaskStatus = null;
    let currentUserRole = null;

    // --- HELPER FUNCTIONS ---

    // 1. Logika Copy Code
    function copyCode() {
        const codeText = document.getElementById('wsCode').innerText;
        navigator.clipboard.writeText(codeText);
        const tooltip = document.getElementById('copyTooltip');
        tooltip.classList.remove('opacity-0', 'translate-y-2');
        setTimeout(() => { tooltip.classList.add('opacity-0', 'translate-y-2'); }, 2000);
    }
    
    // 2. Logika Inisial
    function getInitials(name) {
        if (!name) return 'US'; 
        return name.split(' ')
                    .map(n => n.charAt(0))
                    .join('')
                    .toUpperCase();
    }

    // 3. Logika Render Profil
    function renderProfile(username) {
        const initials = getInitials(username);
        const avatarElement = document.getElementById('userAvatar');
        
        if (avatarElement) {
            // Mengganti gambar placeholder dengan div inisial dinamis
            avatarElement.outerHTML = `
                <div id="userAvatar" class="w-14 h-14 rounded-full border-[3px] border-white shadow-lg overflow-hidden transition-transform transform group-hover:scale-105 bg-taskly-dark flex items-center justify-center text-white text-xl font-bold">
                    ${initials}
                </div>
            `;
        }
    }
    
    // 4. Logika Render Ikon Workspace
    function renderWorkspaceIcons(memberships) {
        const listContainer = document.getElementById('workspaceIconList');
        if (!listContainer) return;
        
        listContainer.innerHTML = ''; 

        memberships.forEach(member => {
            const ws = member.workspace;
            if (!ws) return;

            const initials = getInitials(ws.name);
            // Menentukan border aktif berdasarkan workspace yang sedang dimuat
            const isActive = (ws.id === currentWorkspaceId) ? 'border-taskly-purple' : 'border-gray-200';

            const html = `
                <div class="w-12 h-12 rounded-[16px] bg-white border-2 ${isActive} shadow-md flex items-center justify-center text-taskly-purple font-bold text-lg cursor-pointer transition-all hover:scale-105" title="${ws.name}">
                    ${initials}
                </div>
            `;
            listContainer.insertAdjacentHTML('beforeend', html);
        });
    }

    // 5. Logika Ambil Data Role Aktif
    function getActiveUserRole(allMemberships, currentWorkspaceId) {
        const activeMembership = allMemberships.find(m => m.workspaceId === currentWorkspaceId);
        return activeMembership ? activeMembership.role : 'Member';
    }


    // --- FUNGSI BARU: LOAD TASKS KE KANBAN BOARD ---

    // user-dashboard.html - Ganti seluruh fungsi loadTasks() ini:

// user-dashboard.html - Ganti seluruh fungsi loadTasks() ini:

async function loadTasks() {
    if (!currentWorkspaceId) {
        console.error("Workspace ID tidak terdeteksi. Tidak bisa memuat task.");
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/api/task/${currentWorkspaceId}`);
        const json = await res.json();
        const tasks = json.data; 

        // 1. Bersihkan semua kolom Kanban (TARGETKAN CONTAINER TASK: col-xxx-tasks)
        ['col-todo-tasks', 'col-progress-tasks', 'col-review-tasks', 'col-done-tasks'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });

        // 2. Render Task
        if (tasks && tasks.length > 0) {
            tasks.forEach(task => {
                let colId;
                let borderColor = 'border-gray-200';
                let textColor = 'text-gray-600';
                
                switch (task.status) {
                    case 'To Do': 
                        colId = 'col-todo-tasks'; borderColor = 'border-gray-200'; textColor = 'text-gray-600'; break;
                    case 'In Progress': 
                        colId = 'col-progress-tasks'; borderColor = 'border-purple-200'; textColor = 'text-purple-700'; break;
                    case 'Review': 
                        colId = 'col-review-tasks'; borderColor = 'border-orange-200'; textColor = 'text-orange-700'; break;
                    case 'Done': 
                        colId = 'col-done-tasks'; borderColor = 'border-green-200'; textColor = 'text-green-700'; break;
                    default: return; 
                }

                const targetColumn = document.getElementById(colId); // <-- TARGET SUDAH BENAR: COL-XXX-TASKS
                if (targetColumn) {
                    const isCompleted = (task.status === 'Done');
                    const card = `
                        <div id="task-${task.id}"
                             draggable="${!isCompleted}"
                             ondragstart="dragStart(event)"
                             data-task-id="${task.id}"
                             data-current-status="${task.status}"
                             class="task-card border ${borderColor} rounded-xl px-4 py-2.5 bg-white shadow-sm hover:shadow-md transition cursor-pointer flex justify-between items-center group mb-3 ${isCompleted ? 'opacity-70 cursor-default' : ''}">
                            <span class="text-sm font-medium ${textColor} truncate max-w-[80%]">${task.title}</span>
                            <span class="text-[10px] text-gray-400">#${task.priority ? task.priority.charAt(0) : '?'}</span> 
                        </div>
                    `;
                    targetColumn.insertAdjacentHTML('beforeend', card);
                }
            });
        }
        
        // --- 4. HAPUS EFEK LOADING ---
        const dashboardContent = document.getElementById('dashboardContent');
        if (dashboardContent) {
            dashboardContent.classList.remove('opacity-60', 'pointer-events-none', 'filter', 'grayscale-[20%]');
        }

    } catch (e) {
        console.error("[LOAD TASKS] Gagal mengambil task. Pastikan TaskController aktif.", e);
    }
}

    function dragStart(e) {
        // e.currentTarget memastikan kita selalu mengambil DIV yang punya event ondragstart (yaitu task-card)
        const card = e.currentTarget; 
        
        draggedTaskId = card.getAttribute('data-task-id');
        draggedTaskStatus = card.getAttribute('data-current-status');
        
        // Menggunakan tipe data spesifik untuk keamanan & keandalan
        e.dataTransfer.setData('text/task-id', draggedTaskId);
        e.dataTransfer.effectAllowed = 'move';
        
        // Styling visual
        setTimeout(() => card.classList.add('dragging'), 40); 
    }

    function dragEnter(e) {
        e.preventDefault();
        const dropZone = e.target.closest('.kanban-column');
        if (dropZone) {
            dropZone.classList.add('drag-over');
        }
    }

    function dragLeave(e) {
        // Hapus class highlight HANYA jika kursor keluar dari kolom target
        const dropZone = e.target.closest('.kankan-column');
        if (dropZone) {
            dropZone.classList.remove('drag-over');
        }
    }

    function dragOver(e) {
        e.preventDefault(); 
        // Periksa apakah data yang ditransfer adalah task-id yang kita harapkan
        if (e.dataTransfer.types.includes('text/task-id')) {
            e.dataTransfer.dropEffect = 'move';
        }
    }

    async function dragDrop(e) {
    e.preventDefault();
    
    const dropZone = e.target.closest('.kanban-column'); 
    if (!dropZone) return;
    
    // Hapus styling drag-over dari kolom drop
    dropZone.classList.remove('drag-over');

    const card = document.getElementById(`task-${draggedTaskId}`);
    if (card) card.classList.remove('dragging'); 

    const newColumnId = dropZone.id;
    
    // Konversi ID kolom menjadi string Status yang sesuai dengan Backend
    let newStatus;
    switch (newColumnId) {
        case 'col-todo': newStatus = 'To Do'; break;
        case 'col-progress': newStatus = 'In Progress'; break;
        case 'col-review': newStatus = 'Review'; break;
        case 'col-done': newStatus = 'Done'; break; // Target Done
        default: return;
    }
    
    // --- LOGIKA PEMBATASAN AKSES KE KOLOM DONE ---
    const forbiddenStatuses = ['Member', 'Employee']; // Asumsi role pengguna biasa
    
    if (newStatus === 'Done' && forbiddenStatuses.includes(currentUserRole)) {
        alert("Akses Ditolak: Hanya Project Manager atau Owner yang dapat memfinalisasi tugas!");
        await loadTasks(); // Muat ulang untuk mengembalikan kartu ke posisi semula
        return;
    }
    // --- AKHIR PEMBATASAN AKSES ---


    // Panggil fungsi API jika status berbeda dari sebelumnya
    if (draggedTaskId && newStatus && newStatus !== draggedTaskStatus) {
        await moveTask(draggedTaskId, newStatus);
    }
    
    draggedTaskId = null;
    draggedTaskStatus = null;
}


    // 7. FUNGSI LOAD TASKS KE KANBAN BOARD
    // user-dashboard.html - Ganti seluruh fungsi loadTasks()

async function loadTasks() {
    const userId = localStorage.getItem('userId'); // Ambil user ID
    if (!currentWorkspaceId || !userId) {
        console.error("ID tidak lengkap.");
        return;
    }

    try {
        const res = await fetch(`http://localhost:3000/api/task/user/${currentWorkspaceId}/${userId}`);
        const json = await res.json();
        const tasks = json.data; 

        // 2. Bersihkan semua kolom Kanban (Targetkan div task container)
        // PERHATIKAN: Target diubah ke col-xxx-tasks
        ['col-todo-tasks', 'col-progress-tasks', 'col-review-tasks', 'col-done-tasks'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = '';
        });

        // 3. Render Task
        if (tasks && tasks.length > 0) {
            tasks.forEach(task => {
                let colId;
                let borderColor = 'border-gray-200';
                let textColor = 'text-gray-600';
                
                switch (task.status) {
                    case 'To Do': 
                        colId = 'col-todo-tasks'; break;
                    case 'In Progress': 
                        colId = 'col-progress-tasks'; borderColor = 'border-purple-200'; textColor = 'text-purple-700'; break;
                    case 'Review': 
                        colId = 'col-review-tasks'; borderColor = 'border-orange-200'; textColor = 'text-orange-700'; break;
                    case 'Done': 
                        colId = 'col-done-tasks'; borderColor = 'border-green-200'; textColor = 'text-green-700'; break;
                    default: return; 
                }

                const targetColumn = document.getElementById(colId);
                if (targetColumn) {
                    const isCompleted = (task.status === 'Done');
                    const card = `
                        <div id="task-${task.id}"
                             draggable="${!isCompleted}"
                             ondragstart="dragStart(event)"
                             data-task-id="${task.id}"
                             data-current-status="${task.status}"
                             class="task-card border ${borderColor} rounded-xl px-4 py-2.5 bg-white shadow-sm hover:shadow-md transition cursor-pointer flex justify-between items-center group mb-3 ${isCompleted ? 'opacity-70 cursor-default' : ''}">
                            <span class="text-sm font-medium ${textColor} truncate max-w-[80%]">${task.title}</span>
                            <span class="text-[10px] text-gray-400">#${task.priority ? task.priority.charAt(0) : '?'}</span> 
                        </div>
                    `;
                    targetColumn.insertAdjacentHTML('beforeend', card);
                }
            });
        }
        
        // --- 4. HAPUS EFEK LOADING ---
        const dashboardContent = document.getElementById('dashboardContent');
        if (dashboardContent) {
            dashboardContent.classList.remove('opacity-60', 'pointer-events-none', 'filter', 'grayscale-[20%]');
        }

    } catch (e) {
        console.error("[LOAD TASKS] Gagal mengambil task. Pastikan TaskController aktif.", e);
    }
}    
    // 8. FUNGSI MOVE TASK (API Call)
    async function moveTask(taskId, newStatus) {
        if(!newStatus) return; 

        try {
            // Kirim permintaan PATCH ke API untuk update status
            const res = await fetch(`http://localhost:3000/api/task/${taskId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    status: newStatus,
                    userId: localStorage.getItem('userId') 
                })
            });

            if (res.ok) {
                // Refresh papan Kanban setelah pemindahan berhasil
                await loadTasks();
                console.log(`Task ${taskId} berhasil dipindahkan ke: ${newStatus}`);
            } else {
                const errorData = await res.json();
                alert(`Gagal memindahkan task: ${errorData.message}`);
            }
        } catch(e) {
            console.error("Failed to move task:", e);
            alert("Error: Tidak bisa terhubung ke server untuk memindahkan task.");
        }
    }
    // --- INIT (DOMContentLoaded) ---
    document.addEventListener('DOMContentLoaded', async () => {
        const userId = localStorage.getItem('userId');
        
        if (!userId) {
            window.location.replace('login.html');
            return;
        }

        try {
            const res = await fetch(`http://localhost:3000/api/auth/${userId}`);
            const data = await res.json();
            const user = data.data;

            if (res.ok) {
                
                if(user.workspace) {
                    const ws = user.workspace;
                    
                    // Set Global State & Data Utama
                    currentWorkspaceId = ws.id; 
                    
                    document.getElementById('wsName').innerText = ws.name;
                    document.getElementById('wsCode').innerText = ws.workspaceCode;
                    
                    // Tampilkan Role User
                    const role = getActiveUserRole(user.allMemberships, currentWorkspaceId);
                    const roleEl = document.getElementById('userRole');
                    if(roleEl) roleEl.innerText = role.toUpperCase();

                    currentUserRole = role;
                    
                    // Render Sidebar (User Initials & Workspace List)
                    renderProfile(user.username);
                    renderWorkspaceIcons(user.allMemberships);
                    
                    // Lanjutkan dengan memuat tasks/widgets
                    loadTasks(); 
                    
                } 
                else { 
                    window.location.replace('new.html');
                }
                
            } else if (res.status === 404) {
                alert("Sesi tidak valid. Silakan login ulang.");
                window.location.replace('login.html');
                
            } else {
                console.error("API Error:", data.message);
                alert(`API Error: ${data.message}. Cek Console untuk detail.`);
            }
        } catch (err) {
            console.error("Network or Fetch Error:", err);
            alert("Tidak bisa terhubung ke server. Pastikan Backend berjalan.");
        }
    });

</script>
